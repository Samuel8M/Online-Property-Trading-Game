kind = "web"
previewPath = "/"
title = "Monopoly Online"
description = "A fan-made multiplayer Monopoly game with the classic 40-space US board, animated dice, doubles, jail rules, and shared online rooms."
version = "1.0.0"
id = "artifacts/property-pursuit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22077

[services.development]
run = "pnpm --filter @workspace/property-pursuit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/property-pursuit", "run", "build" ]
serve = "static"
publicDir = "artifacts/property-pursuit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22077"
BASE_PATH = "/"